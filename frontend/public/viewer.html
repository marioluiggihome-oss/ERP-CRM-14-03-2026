<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Secciones</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #1e293b;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #ea580c;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 1.2rem;
        }
        .image-viewer {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }
        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
        }
        button {
            background: #ea580c;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #c2410c;
            transform: scale(1.05);
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: scale(1);
        }
        .counter {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ea580c;
            padding: 10px 30px;
            background: rgba(234, 88, 12, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Visor de Secciones PowerPoint</h1>
        <p class="subtitle">LUIGGI HOME - Secciones Blindadas</p>
        
        <div class="image-viewer">
            <img id="currentImage" src="/temp_images/image1.png" alt="Sección">
        </div>
        
        <div class="controls">
            <button id="prevBtn" onclick="previousImage()">← Anterior</button>
            <div class="counter">
                <span id="currentNum">1</span> / <span id="totalNum">9</span>
            </div>
            <button id="nextBtn" onclick="nextImage()">Siguiente →</button>
        </div>
    </div>

    <script>
        let currentIndex = 1;
        const totalImages = 9;
        
        function updateImage() {
            document.getElementById('currentImage').src = `/temp_images/image${currentIndex}.png`;
            document.getElementById('currentNum').textContent = currentIndex;
            
            // Update button states
            document.getElementById('prevBtn').disabled = currentIndex === 1;
            document.getElementById('nextBtn').disabled = currentIndex === totalImages;
        }
        
        function nextImage() {
            if (currentIndex < totalImages) {
                currentIndex++;
                updateImage();
            }
        }
        
        function previousImage() {
            if (currentIndex > 1) {
                currentIndex--;
                updateImage();
            }
        }
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') previousImage();
        });
        
        updateImage();
    </script>
</body>
</html>
