<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!-- viewport-fit=cover: en tablets y móviles con esquinas redondeadas o
             barra de gestos, sin esto queda una franja muerta arriba y abajo. -->
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#0f172a" />
        <meta name="description" content="Sistema profesional de presupuestos para distribuidores de cocinas" />

        <!-- INSTALABLE COMO APP. Es el equivalente real al F11 del portátil:
             instalada en la pantalla de inicio, el ERP abre SIN pestañas y SIN
             barra de direcciones, y ya no las vuelve a enseñar. En una tablet de
             8" eso son ~150 px de alto recuperados, que es casi un quinto de la
             pantalla. El botón de pantalla completa de dentro de la app es el
             apaño para cuando no está instalada. -->
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Gestión Profesional" />
        
        <!-- Protección contra copia -->
        <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
        <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
        <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'self';" />
        
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>Gestión Profesional</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
        <script>
          // Título por marca de entrada: carpenter.io muestra la marca carpinteros.
          try {
            var h = (location.hostname||'').toLowerCase();
            var q = new URLSearchParams(location.search);
            if (h.indexOf('carpenter.io')>-1 || h.indexOf('carpinter.io')>-1 || q.get('brand')==='carpinteros') {
              document.title = 'carpinter.io — El taller en tu pantalla';
            }
          } catch(e){}
        </script>
        <script>
            // emergent-main.js envuelve window.fetch y consume el cuerpo de las
            // respuestas, provocando "body stream already read" al GUARDAR
            // (contactos, visitas, presupuestos...). Solo se carga dentro del
            // editor de la plataforma (iframe); en producción (acceso directo)
            // NO se carga, para no romper los guardados.
            if (window.self !== window.top) {
                var emMain = document.createElement('script');
                emMain.src = 'https://assets.emergent.sh/scripts/emergent-main.js';
                document.head.appendChild(emMain);
            }
        </script>
        
        <!-- Script de protección temprana -->
        <script>
            // Protección temprana antes de que cargue React
            (function() {
                // Deshabilitar clic derecho inmediatamente
                document.addEventListener('contextmenu', function(e) {
                    e.preventDefault();
                    return false;
                });
                
                // Deshabilitar teclas peligrosas
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'F12' || 
                        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
                        (e.ctrlKey && (e.key === 'u' || e.key === 's'))) {
                        e.preventDefault();
                        return false;
                    }
                });
                
                // Mensaje en consola
                console.log('%c⚠️ SISTEMA PROTEGIDO', 'color: red; font-size: 24px; font-weight: bold;');
                console.log('%cLUIGGI HOME - Acceso no autorizado prohibido', 'color: orange; font-size: 12px;');
            })();
        </script>
        
        <!--
        These two scripts have been added for the Visual Edits, please do not edit or remove them
        -->
        <script>
            // Only load visual edit scripts when inside an iframe
            if (window.self !== window.top) {
                // Load debug monitor script
                var debugMonitorScript = document.createElement('script');
                debugMonitorScript.src = 'https://assets.emergent.sh/scripts/debug-monitor.js';
                document.head.appendChild(debugMonitorScript);

                // Configure Tailwind
                window.tailwind = window.tailwind || {};
                tailwind.config = {
                    corePlugins: { preflight: false },
                };

                // Load Tailwind CDN
                var tailwindScript = document.createElement('script');
                tailwindScript.src = 'https://cdn.tailwindcss.com';
                document.head.appendChild(tailwindScript);
            }
        </script>
        
        <!-- Estilos de protección -->
        <style>
            /* Deshabilitar selección de texto por defecto */
            body {
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
            }
            
            /* Permitir selección solo en inputs */
            input, textarea, [contenteditable="true"] {
                -webkit-user-select: text;
                -moz-user-select: text;
                -ms-user-select: text;
                user-select: text;
            }
            
            /* Deshabilitar arrastrar imágenes */
            img {
                -webkit-user-drag: none;
                -khtml-user-drag: none;
                -moz-user-drag: none;
                -o-user-drag: none;
                user-drag: none;
            }
        </style>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

    -->
    </body>
</html>
