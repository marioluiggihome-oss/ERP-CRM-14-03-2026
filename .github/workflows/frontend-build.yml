name: Frontend Build

# Compila el frontend en cada Pull Request y en cada push a las ramas
# principales. Objetivo: que un error de sintaxis (JSX roto, import inexistente,
# etc.) NUNCA llegue a producción ni rompa el deploy de Railway.
#
# La configuración replica exactamente la del build de producción
# (frontend/nixpacks.toml): Node 18, yarn, CI=false y openssl-legacy-provider.
# Así el CI falla ante los mismos errores que romperían el deploy real, sin
# falsas alarmas por warnings que producción tolera.

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"

# Cancela ejecuciones antiguas de la misma rama/PR si llega un push nuevo.
concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar frontend (Node 18 / yarn)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Mismas variables que el build de producción (frontend/nixpacks.toml).
      CI: "false"
      NODE_OPTIONS: "--openssl-legacy-provider"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Instalar dependencias
        run: yarn install --frozen-lockfile

      - name: Compilar (yarn build)
        run: yarn build

      # ── PRUEBAS DE PANTALLA, EN UN NAVEGADOR DE VERDAD ────────────────────
      #
      # Lo que comprueban es LAYOUT: si los nueve botones de Armarios caben en
      # un movil de 390 px, si la botonera se desliza, si el armario queda
      # debajo de la configuracion o al lado (o sea, fuera de la pantalla).
      #
      # Eso NO se puede comprobar leyendo el JSX ni con jsdom, que no tiene
      # motor de layout: por ahi solo se pueden mirar nombres de clases CSS.
      # Las de `backend/tests/test_pantalla_*.py` hacen eso y siguen sirviendo
      # —cazan un borrado en un segundo—, pero la VERDAD sobre si algo cabe la
      # da un navegador con un viewport de verdad, y es esta.
      #
      # Se prueba sobre `build/`, que es lo que llega al movil del master, no
      # sobre el servidor de desarrollo. Todo el backend va simulado: ninguna
      # prueba de pantalla puede depender de que haya un Mongo levantado, o no
      # se ejecutaria aqui — y una prueba que no se ejecuta no protege nada.
      - name: Instalar Chromium para las pruebas de pantalla
        run: npx playwright install --with-deps chromium

      - name: Pruebas de pantalla (Playwright)
        run: yarn test:e2e

      - name: Guardar el rastro si alguna falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rastro-pruebas-pantalla
          path: frontend/test-results/
          retention-days: 7
