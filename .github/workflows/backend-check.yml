name: Backend Check

# Comprobación mínima del backend en cada PR y push: compila todos los .py
# (detecta errores de sintaxis/indentación que romperían el arranque en
# Railway). No instala dependencias: es rápida y sin falsas alarmas.

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/src/**"
      - "herramientas/**"
      - ".github/workflows/backend-check.yml"
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "backend/**"
      - "frontend/src/**"
      - "herramientas/**"
      - ".github/workflows/backend-check.yml"

concurrency:
  group: backend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Sintaxis Python (compileall)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compilar todos los .py del backend
        run: python -m compileall -q backend

      - name: Comprobar modelos y rutas (AST)
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          errores = []
          for p in pathlib.Path('backend').rglob('*.py'):
              try:
                  ast.parse(p.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  errores.append(f"{p}: {e}")
          if errores:
              print("\n".join(errores)); sys.exit(1)
          print("Backend OK: sin errores de sintaxis")
          PY

      # Pruebas de CALCULO: precios, creditos y pedidos. Son las que protegen el
      # dinero, asi que se ejecutan en cada push. No necesitan Mongo ni red: la
      # base de datos se sustituye por un doble en memoria.
      - name: Pruebas de calculo (pytest)
        run: |
          # fastapi hace falta porque las pruebas cargan los routers reales
          # (render_packs, ai_engine) para comprobar los codigos 400/403/503.
          # Mongo, Stripe, httpx y python-multipart si van simulados dentro de
          # las pruebas: no se instalan.
          python -m pip install --quiet pytest fastapi
          python -m pytest backend/tests/test_calculo_*.py -q

      # Aviso de copyright en cada fichero propio. Es la prueba mas barata de
      # titularidad y la mas facil de perder: basta con que un fichero nuevo
      # entre sin el. Se arregla con un comando, que sale en el propio error.
      - name: Aviso de copyright en el codigo propio
        run: python3 herramientas/cabeceras_copyright.py --verificar
